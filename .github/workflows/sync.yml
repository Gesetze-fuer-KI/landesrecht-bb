name: Sync

# Every night: mirror bravors.brandenburg.de (Brandenburg) into this repository and commit what changed.
# The sync code lives in Gesetze-fuer-KI/gesetze-fuer-ki (app/sync.py --land bb); this
# repository holds only data.
#
# The first full pass can take several nights: sync.py stops starting new fetches after
# --max-minutes, saves its progress in .sync/state.json, and the next run carries on. So the
# commit step also runs when the sync failed or was cancelled, and commits .sync/ alone too.
# It is skipped only when sync.py exited 2 (listing broken or state unknown: nothing written).
#
# A failed run sends GitHub's usual failure email.
#
# healthchecks.io (secret HEALTHCHECKS_URL, one check per repository) gets /start when the run begins and, at the
# end, a success ping or /fail; it alerts on a failed run and when a night's run does not happen at all.

on:
  schedule:
    - cron: "47 3 * * *"  # 03:47 UTC, after the other syncs on the shared runner
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    # Our own runner on notefeed-1 (github-runner), one job at a time; Brandenburg runs last, it takes hours.
    runs-on: [self-hosted, gesetze]
    timeout-minutes: 350
    env:
      HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
    steps:
      - name: Report start to healthchecks.io
        if: env.HEALTHCHECKS_URL != ''
        run: curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL/start" > /dev/null || true

      - uses: actions/checkout@v4
        with:
          path: data

      - uses: actions/checkout@v4
        with:
          repository: Gesetze-fuer-KI/gesetze-fuer-ki
          ref: main
          path: tool

      - uses: astral-sh/setup-uv@v6

      - name: Sync
        id: sync
        working-directory: tool/app
        run: |
          # A stale message from an earlier run must not describe this one (see Commit).
          rm -f "$GITHUB_WORKSPACE/data/.sync/commit-message.txt"
          set +e
          uv run --frozen --no-dev python sync.py --out "$GITHUB_WORKSPACE/data" --land bb --max-minutes 330
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Commit
        # Also after a failed or cancelled sync, to keep its progress; not after exit 2.
        if: always() && steps.sync.outcome != 'skipped' && steps.sync.outputs.exit != '2'
        working-directory: data
        run: |
          git config user.name "gesetze-fuer-ki sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          if [ -s .sync/commit-message.txt ]; then
            git commit -q -F .sync/commit-message.txt
          else
            git commit -q -m "Abgleich unterbrochen, Fortschritt gesichert"
          fi
          # Someone may have pushed (README, workflow) while the sync ran; data and those files do not overlap.
          git pull -q --rebase
          git push

      - name: Report result to healthchecks.io
        if: always() && env.HEALTHCHECKS_URL != ''
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then path=""; else path="/fail"; fi
          curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL$path" > /dev/null || true
